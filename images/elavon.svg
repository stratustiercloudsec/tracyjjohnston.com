    <rect x="496" y="212" width="98" height="52" rx="6"/>
    <rect x="636" y="300" width="98" height="52" rx="6"/>
    <rect x="356" y="388" width="98" height="52" rx="6"/>
    <rect x="496" y="476" width="98" height="52" rx="6"/>
  </g>
  <g fill="#9FB3AE"><rect x="88" y="140" width="56" height="6" rx="3"/><rect x="228" y="140" width="48" height="6" rx="3"/><rect x="368" y="140" width="60" height="6" rx="3"/><rect x="508" y="140" width="44" height="6" rx="3"/><rect x="88" y="228" width="50" height="6" rx="3"/><rect x="228" y="228" width="62" height="6" rx="3"/><rect x="368" y="228" width="46" height="6" rx="3"/><rect x="88" y="316" width="58" height="6" rx="3"/><rect x="228" y="316" width="44" height="6" rx="3"/><rect x="368" y="316" width="54" height="6" rx="3"/><rect x="508" y="316" width="60" height="6" rx="3"/><rect x="88" y="404" width="52" height="6" rx="3"/><rect x="228" y="404" width="58" height="6" rx="3"/><rect x="88" y="492" width="60" height="6" rx="3"/><rect x="228" y="492" width="46" height="6" rx="3"/><rect x="368" y="492" width="56" height="6" rx="3"/></g>
  <g fill="#F5F7F6"><rect x="648" y="140" width="52" height="6" rx="3"/><rect x="508" y="228" width="56" height="6" rx="3"/><rect x="648" y="316" width="46" height="6" rx="3"/><rect x="368" y="404" width="58" height="6" rx="3"/><rect x="508" y="492" width="50" height="6" rx="3"/></g>
  <!-- shared cadence line -->
  <path d="M60 560H750" stroke="#10302B" stroke-width="3"/>
  <g fill="#10302B"><circle cx="195" cy="560" r="7"/><circle cx="335" cy="560" r="7"/><circle cx="475" cy="560" r="7"/><circle cx="615" cy="560" r="7"/><circle cx="750" cy="560" r="7"/></g>
