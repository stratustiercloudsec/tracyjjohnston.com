<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration: five team swimlanes moving work together through planning increments on a shared delivery timeline</title>
  <rect width="800" height="600" fill="#EEF2F1"/>
  <!-- planning increments -->
  <g fill="#FFFFFF" stroke="#D3DDDA" stroke-width="2">
    <rect x="60" y="60" width="130" height="480" rx="10"/>
    <rect x="200" y="60" width="130" height="480" rx="10"/>
    <rect x="340" y="60" width="130" height="480" rx="10"/>
    <rect x="480" y="60" width="130" height="480" rx="10"/>
    <rect x="620" y="60" width="130" height="480" rx="10"/>
  </g>
  <g fill="#10302B"><rect x="80" y="80" width="40" height="8" rx="4"/><rect x="220" y="80" width="40" height="8" rx="4"/><rect x="360" y="80" width="40" height="8" rx="4"/><rect x="500" y="80" width="40" height="8" rx="4"/><rect x="640" y="80" width="40" height="8" rx="4"/></g>
  <!-- swimlanes -->
  <g stroke="#D3DDDA" stroke-width="1.5" stroke-dasharray="4 6"><path d="M60 196H750M60 284H750M60 372H750M60 460H750"/></g>
  <!-- work cards: lanes progress further over time -->
  <g fill="#10302B">
    <rect x="76" y="124" width="98" height="52" rx="6"/><rect x="216" y="124" width="98" height="52" rx="6"/><rect x="356" y="124" width="98" height="52" rx="6"/><rect x="496" y="124" width="98" height="52" rx="6"/>
    <rect x="76" y="212" width="98" height="52" rx="6"/><rect x="216" y="212" width="98" height="52" rx="6"/><rect x="356" y="212" width="98" height="52" rx="6"/>
    <rect x="76" y="300" width="98" height="52" rx="6"/><rect x="216" y="300" width="98" height="52" rx="6"/><rect x="356" y="300" width="98" height="52" rx="6"/><rect x="496" y="300" width="98" height="52" rx="6"/>
    <rect x="76" y="388" width="98" height="52" rx="6"/><rect x="216" y="388" width="98" height="52" rx="6"/>
    <rect x="76" y="476" width="98" height="52" rx="6"/><rect x="216" y="476" width="98" height="52" rx="6"/><rect x="356" y="476" width="98" height="52" rx="6"/>
  </g>
  <g fill="#A8782A">
